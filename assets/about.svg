<svg xmlns="http://www.w3.org/2000/svg" width="760" height="624" viewBox="0 0 760 624" role="img" aria-labelledby="t d"><title id="t">Lucas De Paulo — Software Developer | AI Engineer</title><desc id="d">Lucas De Paulo, Software Developer | AI Engineer. Entusiasta de tecnologia e curioso pelo open source. Resolvo problemas com soluções práticas e bem arquitetadas. Atenção ao design em cada detalhe. Movido por curiosidade e criatividade. Fique à vontade para explorar meus repositórios. Nem tudo é público, mas o que está aberto fica à disposição.</desc><style>.in{animation:in .7s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.in{animation:none}}</style><rect x="1" y="1" width="758" height="622" rx="14" fill="#272833" stroke="#3a3c4e"/><g class="in" style="animation-delay:0.00s"><text x="40" y="64" fill="#f8f8f2" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700">Lucas De Paulo</text><text x="40" y="96" fill="#9a9cab" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17">Software Developer | AI Engineer</text></g><g class="in" style="animation-delay:0.18s"><rect x="571.75" y="42" width="148" height="28" rx="14" fill="none" stroke="#A9DC76"/><text x="645.875" y="61" text-anchor="middle" fill="#A9DC76" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13">Formação em Design</text></g><path d="M40 126H720" stroke="#3a3c4e"/><g class="in" style="animation-delay:0.36s"><text x="40" y="164" fill="#A9DC76" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2">FOCO</text><rect x="40" y="178" width="213" height="32" rx="8" fill="#2f3140" stroke="#3a3c4e"/><text x="146.5" y="199" text-anchor="middle" fill="#f8f8f2" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14">Desenvolvimento full-stack</text><rect x="262.98" y="1