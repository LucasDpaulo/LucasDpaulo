name: Update profile stats
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_stats.py
      - name: Save stats
        run: |
          git config user.name "Lucas De Paulo"
          git config user.email "143674761+LucasDpaulo@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile stats"
            git push
          fi
