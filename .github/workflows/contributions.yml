name: Update contribution graph
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/contributions.py
      - name: Save graph
        run: |
          git config user.name "Lucas De Paulo"
          git config user.email "143674761+LucasDpaulo@users.noreply.github.com"
          git add assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution graph"
            git push
          fi
